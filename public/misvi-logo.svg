<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 335 130" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .tagline {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #222636;
        letter-spacing: 0.3px;
      }
      .tm-badge {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 8.5px;
        font-weight: 800;
        fill: #222636;
      }
    </style>
  </defs>

  <!-- Left Swoosh Orbit Ring behind M -->
  <path 
    d="M 66 22 C 34 20, 6 36, 5 63 C 4 88, 24 107, 52 108 C 66 109, 79 103, 89 94 C 81 96, 70 97, 59 96 C 36 94, 18 79, 19 61 C 20 44, 40 31, 66 31 C 77 31, 87 34, 95 38 C 89 29, 79 23, 66 22 Z" 
    fill="#E52D3D" 
    opacity="0.95" 
  />

  <!-- Red Stylized 'M' Glyph -->
  <g fill="#E52D3D">
    <!-- Left Leg and Crest -->
    <path d="M 23 105 C 19 105, 17 101, 18 95 L 32 43 C 34 33, 42 27, 50 28 C 58 29, 63 35, 65 44 C 70 35, 78 27, 88 27 C 100 27, 107 35, 105 48 L 92 98 C 91 103, 87 105, 82 105 C 77 105, 73 101, 75 95 L 85 52 C 86 46, 83 43, 78 43 C 72 43, 65 49, 61 59 L 50 99 C 49 104, 45 105, 40 105 C 35 105, 31 101, 33 95 L 43 52 C 44 46, 41 43, 36 43 C 30 43, 24 51, 23 61 Z" />
    <!-- Rounded Accent Highlights -->
    <path d="M 28 88 C 30 60, 44 38, 58 35 C 44 39, 32 58, 27 84 Z" opacity="0.4" />
  </g>

  <!-- Letter 'i' (first) Solid Dark Dot -->
  <circle cx="147" cy="28" r="9.5" fill="#222636" />

  <!-- Script Letters "isvi" in Deep Slate Charcoal -->
  <g fill="#222636">
    <!-- Letter 'i' (first) -->
    <path d="M 147 45 C 152 45, 156 49, 154 55 L 142 92 C 140 97, 136 102, 130 104 C 122 107, 115 105, 112 101 C 109 96, 111 90, 116 88 C 123 85, 131 87, 134 80 L 142 53 C 143 48, 145 45, 147 45 Z" />

    <!-- Letter 's' -->
    <path d="M 189 54 C 186 47, 179 43, 171 43 C 159 43, 151 52, 153 64 C 155 73, 164 77, 174 80 C 184 83, 190 87, 188 94 C 186 101, 177 106, 167 106 C 155 106, 146 100, 145 92 C 144 87, 148 84, 153 84 C 158 84, 161 88, 165 93 C 167 95, 171 97, 175 96 C 179 95, 181 92, 181 89 C 181 84, 173 81, 164 78 C 151 74, 145 67, 147 57 C 150 44, 163 35, 178 35 C 188 35, 197 40, 200 48 C 201 52, 197 56, 193 56 C 191 56, 190 55, 189 54 Z" />

    <!-- Letter 'v' -->
    <path d="M 197 46 C 202 46, 205 49, 204 55 L 194 85 C 191 95, 196 102, 204 102 C 213 102, 221 95, 226 84 L 236 53 C 237 48, 241 45, 246 46 C 250 47, 252 52, 250 57 L 239 88 C 232 103, 219 111, 203 111 C 187 111, 179 99, 182 84 L 191 53 C 192 48, 194 46, 197 46 Z" />

    <!-- Letter 'i' (second) -->
    <path d="M 271 45 C 276 45, 279 49, 278 54 L 263 94 C 260 102, 254 107, 246 107 C 238 107, 233 102, 234 96 C 235 91, 240 88, 244 89 C 248 90, 250 93, 252 95 C 254 96, 256 95, 257 92 L 268 53 C 269 48, 270 45, 271 45 Z" />
  </g>

  <!-- Red Heart Dot over the 2nd 'i' (Sweet heart icon) -->
  <g transform="translate(269, 22) rotate(14)">
    <path d="M 11.5 3 C 11.5 1.2, 9.2 0, 7.2 0 C 5.2 0, 3.8 1.2, 3.8 3 C 3.8 5.5 7.6 9 11.5 13.5 C 15.4 9 19.2 5.5 19.2 3 C 19.2 1.2, 17.8 0, 15.8 0 C 13.8 0, 11.5 1.2, 11.5 3 Z" fill="#E52D3D" />
  </g>

  <!-- Circled Trademark (TM) in Upper Right -->
  <g transform="translate(304, 16)">
    <circle cx="9" cy="9" r="8" stroke="#222636" stroke-width="1.3" fill="none" />
    <text x="9" y="12" text-anchor="middle" class="tm-badge">TM</text>
  </g>

  <!-- Tagline underneath: "Going For Unique Choice..." -->
  <text x="138" y="129" class="tagline">Going For Unique Choice...</text>
</svg>
